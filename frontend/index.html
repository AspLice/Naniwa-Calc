<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Mechanic Expense</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 460px; margin: 60px auto;">
      <h1>Mechanic Expense Login</h1>
      <p>StaffはPIN不要、Manager/AdminはPIN必須です。</p>
      <div>
        <label>User</label>
        <select id="username"></select>
      </div>
      <div style="margin-top: 10px;">
        <label>PIN (Manager/Admin only)</label>
        <input id="pin" placeholder="0000" />
      </div>
      <button id="loginBtn" class="primary" style="margin-top: 12px; width: 100%;">Login</button>
      <div id="message" class="notice"></div>
    </div>
  </div>

  <script type="module">
    import { api, setSession, getUser } from "./js/api.js";

    if (getUser()) {
      location.href = "dashboard.html";
    }

    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("message");
    const usernameSelect = document.getElementById("username");
    const pinInput = document.getElementById("pin");

    async function loadLoginOptions() {
      const data = await api("/api/auth/login-options");
      usernameSelect.innerHTML = "";

      for (const user of data.users || []) {
        const option = document.createElement("option");
        option.value = user.username;
        option.textContent = `${user.username} (${user.role})`;
        option.dataset.pinRequired = String(user.pinRequired);
        usernameSelect.appendChild(option);
      }

      updatePinState();
    }

    function updatePinState() {
      const selected = usernameSelect.options[usernameSelect.selectedIndex];
      const pinRequired = selected?.dataset.pinRequired === "true";
      pinInput.disabled = !pinRequired;
      if (!pinRequired) {
        pinInput.value = "";
        pinInput.placeholder = "Staffは不要";
      } else {
        pinInput.placeholder = "0000";
      }
    }

    usernameSelect.addEventListener("change", updatePinState);

    loginBtn.addEventListener("click", async () => {
      msg.textContent = "";
      msg.className = "notice";

      try {
        const username = usernameSelect.value.trim();
        const pin = pinInput.value.trim();

        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username, pin }),
        });

        setSession(data.token, data.user);
        location.href = "dashboard.html";
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "notice error";
      }
    });

    loadLoginOptions().catch((err) => {
      msg.textContent = `ログインユーザー取得失敗: ${err.message}`;
      msg.className = "notice error";
    });
  </script>
</body>
</html>
